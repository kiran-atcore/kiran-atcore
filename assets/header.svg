<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#141E36" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Accent Bar Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
    <filter id="pill-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="header-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38BDF8" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="220" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="90" cy="40" r="110" fill="#38BDF8" fill-opacity="0.16" filter="url(#glow-blur)" />
  <circle cx="820" cy="180" r="120" fill="#818CF8" fill-opacity="0.18" filter="url(#glow-blur)" />

  <!-- Background Grid Overlay -->
  <rect width="900" height="220" rx="16" fill="url(#header-grid)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Floating Pill Badge -->
  <g transform="translate(270, 36)">
    <rect width="360" height="28" rx="14" fill="url(#pill-grad)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#38BDF8" />
    <text x="30" y="18" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">FULL STACK DEVELOPER &amp; APPLIED AI</text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="118" text-anchor="middle" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">KIRAN CHAND S</text>

  <!-- Subtitle Tagline -->
  <text x="450" y="152" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.5">NEXT.JS 16 • PYTHON &amp; DJANGO REST • WEBSOCKETS • AWS CLOUD</text>

  <!-- Tech Dots / Stars Decor -->
  <circle cx="180" cy="110" r="1.5" fill="#38BDF8" fill-opacity="0.5" />
  <circle cx="210" cy="75" r="2" fill="#818CF8" fill-opacity="0.6" />
  <circle cx="720" cy="80" r="1.5" fill="#38BDF8" fill-opacity="0.5" />
  <circle cx="690" cy="125" r="2" fill="#C084FC" fill-opacity="0.6" />

  <!-- Bottom Accent Bar -->
  <rect x="0" y="216" width="900" height="4" rx="2" fill="url(#accent-grad)" />
</svg>
