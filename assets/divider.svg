<svg width="100%" height="48" viewBox="0 0 1200 48" fill="none" xmlns="http://www.w3.org/2000/svg" pointer-events="none" style="pointer-events: none; cursor: default; user-select: none;">
  <defs>
    <!-- Core Ambient Radial Glow -->
    <radialGradient id="center-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#818CF8" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#C084FC" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gem-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Horizon Beams -->
    <linearGradient id="beam-fade-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="beam-fade-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="1"/>
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="laser-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    svg, * {
      pointer-events: none !important;
      cursor: default !important;
      user-select: none !important;
    }
    @keyframes pulseAura {
      0%, 100% { transform: scale(0.92); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes laserRunLeft {
      0% { transform: translateX(-350px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(180px); opacity: 0; }
    }
    @keyframes laserRunRight {
      0% { transform: translateX(350px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(-180px); opacity: 0; }
    }
    @keyframes blinkTick {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.9; }
    }

    .aura-glow {
      transform-origin: 600px 24px;
      animation: pulseAura 3s ease-in-out infinite;
    }
    .spin-ring {
      transform-origin: 600px 24px;
      animation: spinClockwise 12s linear infinite;
    }
    .spin-ring-rev {
      transform-origin: 600px 24px;
      animation: spinCounter 18s linear infinite;
    }
    .laser-beam-left {
      animation: laserRunLeft 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .laser-beam-right {
      animation: laserRunRight 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.6s;
    }
    .tick-sync {
      animation: blinkTick 2.4s ease-in-out infinite;
    }
  </style>

  <!-- Background Ambient Aura -->
  <ellipse cx="600" cy="24" rx="140" ry="22" fill="url(#center-ambient)" class="aura-glow"/>

  <!-- Left Main Beam Line -->
  <line x1="60" y1="24" x2="480" y2="24" stroke="url(#beam-fade-left)" stroke-width="1.5"/>
  <line x1="180" y1="24" x2="480" y2="24" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5" filter="url(#soft-glow)"/>

  <!-- Right Main Beam Line -->
  <line x1="720" y1="24" x2="1140" y2="24" stroke="url(#beam-fade-right)" stroke-width="1.5"/>
  <line x1="720" y1="24" x2="1020" y2="24" stroke="#818CF8" stroke-width="2" stroke-opacity="0.5" filter="url(#soft-glow)"/>

  <!-- Cybernetic HUD Calipers & Circuit Geometry (Left) -->
  <path d="M 480 24 L 508 14 L 546 14 L 564 24" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8" filter="url(#soft-glow)"/>
  <path d="M 480 24 L 508 34 L 546 34 L 564 24" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8" filter="url(#soft-glow)"/>
  <line x1="512" y1="18" x2="542" y2="18" stroke="#818CF8" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.7"/>
  <line x1="512" y1="30" x2="542" y2="30" stroke="#818CF8" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.7"/>

  <!-- Cybernetic HUD Calipers & Circuit Geometry (Right) -->
  <path d="M 720 24 L 692 14 L 654 14 L 636 24" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.8" filter="url(#soft-glow)"/>
  <path d="M 720 24 L 692 34 L 654 34 L 636 24" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.8" filter="url(#soft-glow)"/>
  <line x1="688" y1="18" x2="658" y2="18" stroke="#818CF8" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.7"/>
  <line x1="688" y1="30" x2="658" y2="30" stroke="#818CF8" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.7"/>

  <!-- Fine HUD Tick Grids (Symmetric) -->
  <g class="tick-sync" stroke="#38BDF8" stroke-width="1.2">
    <line x1="320" y1="20" x2="320" y2="28"/>
    <line x1="332" y1="21" x2="332" y2="27"/>
    <line x1="344" y1="19" x2="344" y2="29"/>
    <line x1="356" y1="21" x2="356" y2="27"/>
    <line x1="368" y1="20" x2="368" y2="28"/>
  </g>

  <g class="tick-sync" stroke="#C084FC" stroke-width="1.2" style="animation-delay: 1.2s;">
    <line x1="880" y1="20" x2="880" y2="28"/>
    <line x1="868" y1="21" x2="868" y2="27"/>
    <line x1="856" y1="19" x2="856" y2="29"/>
    <line x1="844" y1="21" x2="844" y2="27"/>
    <line x1="832" y1="20" x2="832" y2="28"/>
  </g>

  <!-- Secondary Satellite Circuit Dots -->
  <circle cx="240" cy="24" r="2" fill="#38BDF8" opacity="0.6"/>
  <circle cx="480" cy="24" r="2.5" fill="#38BDF8" filter="url(#soft-glow)"/>
  <circle cx="720" cy="24" r="2.5" fill="#C084FC" filter="url(#soft-glow)"/>
  <circle cx="960" cy="24" r="2" fill="#C084FC" opacity="0.6"/>

  <!-- Dynamic Photon Packet Lasers (Traversing along the track) -->
  <g clip-path="url(#left-clip)">
    <line x1="420" y1="24" x2="490" y2="24" stroke="url(#laser-pulse)" stroke-width="3" filter="url(#intense-glow)" class="laser-beam-left"/>
  </g>
  <g clip-path="url(#right-clip)">
    <line x1="780" y1="24" x2="710" y2="24" stroke="url(#laser-pulse)" stroke-width="3" filter="url(#intense-glow)" class="laser-beam-right"/>
  </g>

  <!-- Clip Paths for Laser Containment -->
  <clipPath id="left-clip">
    <rect x="80" y="10" width="460" height="28"/>
  </clipPath>
  <clipPath id="right-clip">
    <rect x="660" y="10" width="460" height="28"/>
  </clipPath>

  <!-- Central Nexus Core -->
  <g filter="url(#intense-glow)">
    <!-- Outer Counter-Rotating Segmented Tech Ring -->
    <circle cx="600" cy="24" r="20" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="6 8 14 6" stroke-opacity="0.8" class="spin-ring-rev"/>
    
    <!-- Rotating Hexagonal Gyro Ring -->
    <polygon points="600,8 614,16 614,32 600,40 586,32 586,16" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.9" class="spin-ring"/>

    <!-- Concentric Inner Tech Diamond -->
    <polygon points="600,14 610,24 600,34 590,24" fill="#0B132B" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.95"/>

    <!-- Central Glowing Quantum Core -->
    <circle cx="600" cy="24" r="5" fill="url(#gem-glow)"/>
    <circle cx="600" cy="24" r="2" fill="#FFFFFF">
      <animate attributeName="r" values="1.8; 2.8; 1.8" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Crosshair Pips -->
    <line x1="600" y1="5" x2="600" y2="9" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="600" y1="39" x2="600" y2="43" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="581" y1="24" x2="585" y2="24" stroke="#C084FC" stroke-width="1.5"/>
    <line x1="615" y1="24" x2="619" y2="24" stroke="#C084FC" stroke-width="1.5"/>
  </g>

  <!-- Orbiting Quantum Micro-Particles -->
  <g class="spin-ring">
    <circle cx="600" cy="5" r="1.5" fill="#38BDF8" filter="url(#soft-glow)"/>
    <circle cx="600" cy="43" r="1.5" fill="#C084FC" filter="url(#soft-glow)"/>
  </g>
  <g class="spin-ring-rev">
    <circle cx="581" cy="24" r="1.2" fill="#FFFFFF" filter="url(#soft-glow)"/>
    <circle cx="619" cy="24" r="1.2" fill="#818CF8" filter="url(#soft-glow)"/>
  </g>
</svg>
