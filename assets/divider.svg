<svg width="100%" height="20" viewBox="0 0 1000 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Line -->
  <path d="M 100 10 L 900 10" stroke="url(#line-grad)" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Glowing Animated Line Segment -->
  <path d="M 100 10 L 900 10" stroke="url(#line-grad)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0, 800; 800, 0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0; -800" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Center Node -->
  <rect x="495" y="7" width="10" height="6" rx="3" fill="#818CF8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
