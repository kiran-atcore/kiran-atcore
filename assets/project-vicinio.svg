<svg width="100%" height="160" viewBox="0 0 400 160" fill="none" xmlns="http://www.w3.org/2000/svg" pointer-events="none" style="pointer-events: none; cursor: default; user-select: none;">
  <defs>
    <style>
      svg, * {
        pointer-events: none !important;
        cursor: default !important;
        user-select: none !important;
      }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="hex" width="20" height="34.64" patternUnits="userSpaceOnUse" patternTransform="scale(0.5)">
      <path d="M 20 0 L 40 11.54 L 40 34.64 L 20 46.18 L 0 34.64 L 0 11.54 Z" fill="none" stroke="#F43F5E" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="160" rx="12" fill="url(#bg)"/>
  <rect width="400" height="160" rx="12" fill="url(#hex)"/>

  <!-- Map Markers -->
  <g transform="translate(200, 80)">
    <!-- Radar Pulse -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#F43F5E" stroke-width="1">
      <animate attributeName="r" values="10; 60" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Center Marker -->
    <path d="M 0 -15 C -8 -15 -12 -7 -12 0 C -12 10 0 20 0 20 C 0 20 12 10 12 0 C 12 -7 8 -15 0 -15 Z" fill="url(#primary)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="-2" r="4" fill="#FFF"/>

    <!-- Connecting Nodes -->
    <g stroke="#FB923C" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6">
      <line x1="0" y1="0" x2="-80" y2="-40">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite" linear="true"/>
      </line>
      <line x1="0" y1="0" x2="80" y2="-20">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite" linear="true"/>
      </line>
      <line x1="0" y1="0" x2="-50" y2="50">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite" linear="true"/>
      </line>
    </g>

    <!-- Node dots -->
    <circle cx="-80" cy="-40" r="4" fill="#FB923C"/>
    <circle cx="80" cy="-20" r="4" fill="#FB923C"/>
    <circle cx="-50" cy="50" r="4" fill="#FB923C"/>
  </g>
</svg>
