<svg width="100%" height="160" viewBox="0 0 400 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#10B981" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="160" rx="12" fill="url(#bg)"/>
  <rect width="400" height="160" rx="12" fill="url(#grid)"/>

  <!-- Scanning Face/Eye Concept -->
  <g transform="translate(200, 80)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#primary)" stroke-width="2" stroke-dasharray="10 5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner Lens -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#10B981" filter="url(#glow)">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Scanning Line -->
    <line x1="-50" y1="-30" x2="50" y2="-30" stroke="#10B981" stroke-width="2" filter="url(#glow)">
      <animate attributeName="y1" values="-30;30;-30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-30;30;-30" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Neural Network Nodes -->
  <g fill="#3B82F6" opacity="0.6">
    <circle cx="80" cy="40" r="3"/>
    <circle cx="100" cy="80" r="3"/>
    <circle cx="80" cy="120" r="3"/>
    <line x1="80" y1="40" x2="100" y2="80" stroke="#3B82F6" stroke-width="1"/>
    <line x1="100" y1="80" x2="80" y2="120" stroke="#3B82F6" stroke-width="1"/>
    
    <circle cx="320" cy="40" r="3"/>
    <circle cx="300" cy="80" r="3"/>
    <circle cx="320" cy="120" r="3"/>
    <line x1="320" y1="40" x2="300" y2="80" stroke="#3B82F6" stroke-width="1"/>
    <line x1="300" y1="80" x2="320" y2="120" stroke="#3B82F6" stroke-width="1"/>
  </g>
</svg>
